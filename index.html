<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E91B1B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Холодильник">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Холодильник и кошелёк</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: швейцарская сетка в одну колонку до 600px; вместо карточек линии и крупная типографика; одно красное поле на экран (бюджет дня) */
:root{
  --paper:#FFFFFF;--ink:#0D0D0D;--mute:#6B6B6B;--line:#0D0D0D;--hair:#E1E1E1;
  --red:#E91B1B;--on-red:#FFFFFF;--red-text:#D3140F;
  --c1:#E91B1B;--c2:#0D0D0D;--c3:#8C8C8C;--c4:#F08A8A;--c5:#4A4A4A;--c6:#C4C4C4;
  --f-dis:"Geologica","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0B0B0B;--ink:#F2F2F2;--mute:#9A9A9A;--line:#F2F2F2;--hair:#262626;
  --red:#E91B1B;--on-red:#FFFFFF;--red-text:#FF5247;
  --c1:#E91B1B;--c2:#F2F2F2;--c3:#8C8C8C;--c4:#9E2B2B;--c5:#BDBDBD;--c6:#4A4A4A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B0B0B;--ink:#F2F2F2;--mute:#9A9A9A;--line:#F2F2F2;--hair:#262626;
  --red:#E91B1B;--on-red:#FFFFFF;--red-text:#FF5247;
  --c1:#E91B1B;--c2:#F2F2F2;--c3:#8C8C8C;--c4:#9E2B2B;--c5:#BDBDBD;--c6:#4A4A4A;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-dis);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 160px}
#view{display:flex;flex-direction:column;gap:44px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
section{display:flex;flex-direction:column}
.micro{font-family:var(--f-mono);font-size:11px;font-weight:400;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);line-height:1.3}
.pos{color:var(--ink)}
.neg{color:var(--red-text)}

/* Шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 12px;border-bottom:2px solid var(--line);margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.02em;line-height:1.05}
.brand svg{width:28px;height:28px;display:block;flex:none}

/* Главная цифра */
.hero{gap:14px}
.hero-h{display:flex;justify-content:space-between;gap:12px}
.giant{font-weight:800;letter-spacing:-.065em;line-height:.82;white-space:nowrap;display:flex;align-items:flex-start;gap:.05em;
  font-size:min(128px,calc((min(100vw,600px) - 32px) / (var(--len,8) * .62)))}
.giant .cur{font-size:.3em;letter-spacing:0;color:var(--red);margin-top:.1em;font-weight:700}
.giant.neg{color:var(--red-text)}
.ledger{margin:0;display:grid;grid-template-columns:1fr auto;border-top:2px solid var(--line)}
.ledger dt,.ledger dd{margin:0;padding:10px 0;border-bottom:1px solid var(--hair)}
.ledger dd{text-align:right;font-weight:600;padding-left:12px}
.ledger .tot{font-weight:700}

/* Быстрые действия */
.quick{display:grid;grid-template-columns:repeat(4,1fr);border-block:2px solid var(--line)}
.qbtn{background:none;border:0;border-left:1px solid var(--line);padding:12px 10px 14px;text-align:left;display:flex;flex-direction:column;gap:20px;font-weight:700;font-size:15px;letter-spacing:-.02em;transition:background .25s var(--ease),color .25s var(--ease)}
.qbtn:first-child{border-left:0}
.qbtn .plus{font-family:var(--f-mono);font-weight:400;font-size:18px;line-height:1;color:var(--red)}
.qbtn:hover,.qbtn:active{background:var(--ink);color:var(--paper)}

/* Красное поле бюджета */
.field{margin-inline:-16px;padding:18px 16px 20px;background:var(--red);color:var(--on-red);gap:14px}
.field.alert{background:var(--ink);color:var(--paper)}
.field.alert .big2{color:var(--red-text)}
.field .micro{color:inherit;opacity:.85}
.big2{font-weight:800;letter-spacing:-.055em;line-height:.88;font-size:clamp(48px,15vw,80px);white-space:nowrap}
.meter{height:3px;background:color-mix(in srgb,currentColor 28%,transparent)}
.meter i{display:block;height:100%;max-width:100%;background:currentColor}
.frow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.frow .v{font-weight:600}
.field p{margin:0;font-size:13px;opacity:.85}
.fbtn{align-self:flex-start;background:var(--on-red);color:var(--red);border:0;padding:13px 16px;font-weight:700}

/* Заголовки секций */
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:2px solid var(--line);padding-top:10px;margin-bottom:4px}
.sh h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1.1}

/* Сетка 2×2 */
.grid4{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.cell{padding:12px 12px 16px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.cell:nth-child(2n){padding-left:12px;padding-right:0;border-left:1px solid var(--line)}
.cell .v{font-size:clamp(20px,6.6vw,30px);font-weight:700;letter-spacing:-.045em;line-height:1;overflow-wrap:anywhere}
.cell .s{font-size:12px;color:var(--mute)}

/* Строки записей */
.row{display:grid;grid-template-columns:74px 1fr auto;gap:2px 10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--hair)}
.row .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .amt{text-align:right;font-weight:600;white-space:nowrap}
.row .sub{grid-column:2;font-size:13px;color:var(--mute);min-width:0}
.row .x{grid-column:3;justify-self:end}
.tag{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.tag.eat{color:var(--mute)}
.tag.waste,.tag.low,.tag.income{color:var(--red-text)}
.x{background:none;border:0;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:4px 0 4px 8px}
.x[data-armed]{color:var(--red-text);font-weight:500}
.day{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:22px 0 8px;border-bottom:2px solid var(--line)}
.day:first-child{padding-top:4px}
.day b{font-size:18px;font-weight:700;letter-spacing:-.03em}
.empty{padding:20px 0;border-block:1px solid var(--line);color:var(--mute)}

/* Запасы */
.item{padding:14px 0 16px;border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.item-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item-h b{font-size:19px;font-weight:700;letter-spacing:-.03em;min-width:0;overflow-wrap:anywhere}
.item-h span{font-weight:600;white-space:nowrap}
.line{height:2px;background:var(--hair)}
.line i{display:block;height:100%;max-width:100%;background:var(--ink)}
.line.low i,.line.over i{background:var(--red)}
.item-f{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute)}
.item-a{display:flex;margin-top:2px}
.sbtn{background:none;border:1px solid var(--line);padding:8px 14px;font-weight:600;font-size:13px}
.sbtn+.sbtn{border-left:0}
.sbtn.main{background:var(--ink);color:var(--paper)}
.link{background:none;border:0;padding:12px 0;font-weight:600;align-self:flex-start;border-bottom:1.5px solid var(--red)}

/* Период и график */
.period{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.period h1{margin:4px 0 0;font-size:clamp(42px,13vw,68px);font-weight:800;letter-spacing:-.065em;line-height:.85;white-space:nowrap}
.period.w h1{font-size:clamp(28px,8.4vw,46px);letter-spacing:-.05em}
.arrows{display:flex;flex:none}
.arrows button{width:46px;height:46px;border:1.5px solid var(--line);background:none;font-size:18px}
.arrows button+button{border-left:0}
.arrows button:disabled{opacity:.22;cursor:default}
.chart-top{display:flex;justify-content:space-between;gap:10px;margin:6px 0 12px}
.lim{color:var(--red-text)}
.bars{position:relative;display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1.5px solid var(--line)}
.bars div{flex:1;background:var(--ink);min-height:0}
.bars div.zero{background:transparent}
.bars div.over{background:var(--red)}
.bars div.now{box-shadow:inset 0 0 0 2px var(--red)}
.bars .plan{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--red);pointer-events:none}
.axis{display:flex;justify-content:space-between;margin-top:6px}
.axis.w span{flex:1;text-align:center}
.cat{display:grid;grid-template-columns:1fr auto;gap:7px 12px;padding:11px 0;border-bottom:1px solid var(--hair)}
.cat .line{grid-column:1/-1}
.cat .amt{font-weight:600;white-space:nowrap}
.cat .pct{font-family:var(--f-mono);font-size:10px;color:var(--mute);margin-left:8px;text-transform:uppercase;letter-spacing:.05em}
.cat.cur>span:first-child{font-weight:700}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--line)}
.seg.s2{grid-template-columns:1fr 1fr}
.seg button{background:none;border:0;border-left:1.5px solid var(--line);padding:11px 4px;font-weight:600;font-size:14px;transition:background .2s var(--ease),color .2s var(--ease)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Заметка-плашка */
.note{margin-inline:-16px;padding:16px;background:var(--ink);color:var(--paper);gap:12px}
.note p{margin:0;font-size:14px}
.note .micro{color:var(--red)}
.note button{align-self:flex-start;background:var(--red);color:var(--on-red);border:0;padding:13px 16px;font-weight:700}

/* Настройки и поля */
.block{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.block>p,.block form>p{margin:0;color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:5px 2px 5px 10px;font-size:14px}
.chip i{width:8px;height:8px;flex:none}
.chip .x{padding:4px 8px}
.inline{display:flex;gap:0;align-items:flex-end}
.inline input{flex:1;min-width:0}
.inline button{flex:none}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
input,select,textarea{background:transparent;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:9px 0;font-size:17px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input[type="checkbox"],input[type="radio"]{-webkit-appearance:auto;appearance:auto}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 10px) 52%,calc(100% - 5px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
select option{background:var(--paper);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}
textarea{border:1.5px solid var(--line);padding:10px;font-family:var(--f-mono);font-size:12px;min-height:90px}
.two{display:grid;grid-template-columns:1fr 92px;gap:16px}
.two.eq{grid-template-columns:1fr 1fr}
.primary{background:var(--red);color:var(--on-red);border:0;padding:15px 16px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:background .2s var(--ease)}
.primary:active{background:var(--ink);color:var(--paper)}
.ghost{background:none;border:1.5px solid var(--line);padding:14px 16px;font-weight:600;text-align:left}
.danger{background:none;border:1.5px solid var(--red);color:var(--red-text);padding:14px 16px;font-weight:600;text-align:left}
.danger[data-armed]{background:var(--red);color:var(--on-red)}
.btns{display:grid;grid-template-columns:1fr 1fr}
.btns .ghost{border-right:0}
.hint{margin:0;font-size:13px;color:var(--mute);min-height:1.2em}
.err{margin:0;font-size:13px;color:var(--red-text);font-weight:500}
.check{display:flex;gap:12px;align-items:center;font-size:15px}
.check input{width:20px;height:20px;flex:none;accent-color:var(--red)}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick label{position:relative}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 12px;font-size:14px}
.pick span i{width:8px;height:8px}
.pick input:checked+span{background:var(--ink);color:var(--paper)}
.pick input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}
fieldset{border:0;padding:0;margin:0;min-width:0}

/* Нижний таб-бар и кнопка «+» */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{position:relative;background:none;border:0;padding:10px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-2px;left:22%;right:22%;height:4px;background:var(--red)}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border:0;background:var(--red);color:var(--on-red);font-size:34px;font-weight:300;line-height:1;z-index:6}

/* Нижний лист */
.backdrop{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:90%;overflow:auto;background:var(--paper);border-top:2px solid var(--line);padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:568px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
form{display:flex;flex-direction:column;gap:18px}
.trip{margin:0;font-size:13px;border:1px solid var(--line);padding:10px 12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:11px 16px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion: no-preference){
  .enter>*{animation:rise .7s var(--ease) both}
  .enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}
  .enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .sheet{animation:up .45s var(--ease)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .fab{transition:transform .5s var(--ease)}
  .fab:hover{transform:rotate(90deg)}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="var(--red)"/><circle cx="27" cy="32" r="14.75" fill="var(--on-red)"/><circle cx="27" cy="32" r="10.25" fill="none" stroke="var(--red)" stroke-width="1.25"/><rect x="46.5" y="17.25" width="5" height="29.5" rx="2.5" fill="var(--on-red)"/></svg><span>Холодильник<br>и кошелёк</span></div>
    <div class="micro" id="hdrDate"></div>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Добавить запись">+</button>

<nav class="tabs" aria-label="Разделы"><div class="in" id="tabs"></div></nav>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Новая запись" hidden><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const KEY='holodilnik-koshelek-v1';
let storageOk=true;
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){storageOk=false;return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false}}

const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ds(d)};
const diffDays=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const money=x=>nf.format(Math.round(x||0))+' ₸';
const smoney=x=>(x<0?'−':'')+money(Math.abs(x));
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:NaN};
const pct=(v,max)=>max>0?Math.max(0,Math.min(100,v/max*100)).toFixed(1):'0';
function qty(q,u){if(u==='г'&&q>=1000)return nf2.format(q/1000)+' кг';if(u==='мл'&&q>=1000)return nf2.format(q/1000)+' л';return nf2.format(q)+' '+u}
const MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MPRE=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MGEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MSH=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
function dLong(s){const d=new Date(s+'T12:00:00');return d.getDate()+' '+MGEN[d.getMonth()]}
function dayLabel(s){const t=today();const d=new Date(s+'T12:00:00');const base=dLong(s)+', '+WD[d.getDay()];if(s===t)return 'Сегодня, '+base;if(s===addDays(t,-1))return 'Вчера, '+base;return base}
function rangeLabel(a,b){const x=new Date(a+'T12:00:00'),y=new Date(b+'T12:00:00');return x.getMonth()===y.getMonth()?`${x.getDate()}–${y.getDate()} ${MSH[y.getMonth()]}`:`${x.getDate()} ${MSH[x.getMonth()]} – ${y.getDate()} ${MSH[y.getMonth()]}`}
const inMonthPrep=m=>MPRE[m].replace(/ь$/,'е').replace(/й$/,'е').replace(/т$/,'те');
const CATCOL=['--c1','--c2','--c3','--c4','--c5','--c6'];

// ---- месяцы и недели ----
const monthOf=d=>d.slice(0,7);
const dim=m=>{const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};
const shiftM=(m,n)=>{const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mLast=m=>m+'-'+pad(dim(m));
function weekStart(d){const x=new Date(d+'T12:00:00');return addDays(d,-((x.getDay()+6)%7))}
function daysOf(a,b){const r=[];for(let d=a;d<=b;d=addDays(d,1))r.push(d);return r}

function defSrcs(){return[{id:'src_salary',name:'Зарплата',col:0},{id:'src_dep',name:'Депозит',col:1},{id:'src_side',name:'Подработка',col:4},{id:'src_other',name:'Другое',col:2}]}
function blank(){const t=today();return{v:2,demo:false,settings:{capital:0,capitalDate:t.slice(0,8)+'01',carry:true},
  cats:[{id:'food',name:'Продукты',col:0,fixed:true},{id:uid(),name:'Транспорт',col:1},{id:uid(),name:'Дом и связь',col:4},{id:uid(),name:'Другое',col:2}],
  srcs:defSrcs(),buys:[],eats:[],spends:[],incomes:[]}}
function migrate(s){if(!s.srcs)s.srcs=defSrcs();if(s.settings.carry==null)s.settings.carry=true;
  for(const i of s.incomes||[])if(!i.srcId)i.srcId=/зарп|аванс/i.test(i.note||'')?'src_salary':/депоз/i.test(i.note||'')?'src_dep':'src_other';
  s.v=2;return s}
function demo(){const t=today(),d=n=>addDays(t,-n);const s=blank();s.demo=true;s.settings={capital:35000,capitalDate:d(6),carry:true};
  const [tr,home,oth]=[s.cats[1].id,s.cats[2].id,s.cats[3].id];let ts=1;
  const B=(name,q,unit,price,dd)=>{const b={id:uid()+ts,name,qty:q,unit,price,date:dd,ts:ts++};s.buys.push(b);return b};
  const E=(b,q,dd,w)=>s.eats.push({id:uid()+ts,batchId:b.id,qty:q,date:dd,waste:!!w,ts:ts++});
  const gr=B('Гречка',800,'г',900,d(6)),ch=B('Курица (филе)',1000,'г',3000,d(3)),ri=B('Рис',900,'г',650,d(3)),eg=B('Яйца',10,'шт',1100,d(3)),
        mi=B('Молоко',1000,'мл',620,d(1)),cu=B('Огурцы',500,'г',700,d(1)),br=B('Хлеб',1,'шт',250,d(4));
  E(gr,200,d(5));E(gr,200,d(4));E(gr,200,d(3));E(gr,150,d(2));E(br,0.5,d(4));E(br,0.5,d(2),true);
  E(ch,300,d(2));E(ch,250,d(1));E(ri,150,d(2));E(ri,150,d(1));E(eg,2,d(2));E(eg,3,d(1));E(eg,2,d(0));E(mi,250,d(1));E(cu,200,d(0));
  s.spends.push({id:uid()+'a',catId:home,amount:3000,note:'Мобильная связь',date:d(5),ts:ts++},{id:uid()+'b',catId:tr,amount:1200,note:'Такси',date:d(2),ts:ts++},{id:uid()+'c',catId:oth,amount:900,note:'Кофе',date:d(0),ts:ts++});
  s.incomes.push({id:uid()+'d',srcId:'src_salary',amount:250000,note:'',date:d(4),ts:ts++},{id:uid()+'e',srcId:'src_dep',amount:30000,note:'Сняла с депозита',date:d(2),ts:ts++});return s}

let S=load();if(!S){S=demo();save()}else{S=migrate(S);save()}
let tab='today',month=today().slice(0,7),week=weekStart(today()),statMode='month',showFinished=false,sheetMode='buy',trip={n:0,sum:0};
let animateNext=true,firstLoad=true,installEvt=null;
const isAppBuild=!!document.querySelector('link[rel="manifest"]');
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches}catch(e){return false}};

// ---- расчёты ----
const unitPrice=b=>b&&b.qty>0?b.price/b.qty:0;
const batch=id=>S.buys.find(b=>b.id===id);
function eatenMap(){const m={};for(const e of S.eats)m[e.batchId]=(m[e.batchId]||0)+e.qty;return m}
const rem=(b,m)=>Math.max(0,+(b.qty-(m[b.id]||0)).toFixed(3));
const eatVal=e=>e.qty*unitPrice(batch(e.batchId));
const sinceCap=e=>e.date>=S.settings.capitalDate;
const startM=()=>monthOf(S.settings.capitalDate);
function perUnit(b){const p=unitPrice(b);if(b.unit==='г')return money(p*1000)+'/кг';if(b.unit==='мл')return money(p*1000)+'/л';return money(p)+'/шт'}
const inR=(a,b)=>e=>e.date>=a&&e.date<=b&&sinceCap(e);
const spentR=(a,b)=>sum(S.buys.filter(inR(a,b)),'price')+sum(S.spends.filter(inR(a,b)),'amount');
const incR=(a,b)=>sum(S.incomes.filter(inR(a,b)),'amount');
const spentOn=d=>spentR(d,d);
const eatenOn=d=>S.eats.filter(e=>e.date===d&&!e.waste).reduce((s,e)=>s+eatVal(e),0);
// Деньги месяца: перенос с прошлого месяца + доходы месяца − траты месяца
const mInc=m=>incR(m+'-01',mLast(m));
const mSpent=m=>spentR(m+'-01',mLast(m));
function mCarry(m){const s=startM();if(m<s)return 0;if(m===s)return +S.settings.capital||0;if(!S.settings.carry)return 0;return mEnd(shiftM(m,-1))}
const mStart=m=>mCarry(m)+mInc(m);
const mEnd=m=>mStart(m)-mSpent(m);
function totalMoney(){return(+S.settings.capital||0)+sum(S.incomes.filter(sinceCap),'amount')-sum(S.buys.filter(sinceCap),'price')-sum(S.spends.filter(sinceCap),'amount')}
// План на день: деньги месяца поровну на дни месяца (с даты начала учёта в первый месяц)
function dayBudget(d){const m=monthOf(d),s=startM();if(m<s||d<S.settings.capitalDate)return 0;
  const first=m===s?+S.settings.capitalDate.slice(8):1;return mStart(m)/(dim(m)-first+1)}
const planR=(a,b)=>daysOf(a,b).reduce((s,d)=>s+dayBudget(d),0);
function allowance(){const t=today(),m=monthOf(t);const from=m===startM()?S.settings.capitalDate:m+'-01';
  const avail=mStart(m)-(t>from?spentR(from,addDays(t,-1)):0);const left=dim(m)-(+t.slice(8))+1;const per=avail/left;
  return{per,left,spent:spentOn(t),rest:per-spentOn(t),avail}}
function stockValue(){const m=eatenMap();return S.buys.reduce((s,b)=>s+rem(b,m)*unitPrice(b),0)}
function avgDaily(){const t=today();let from=addDays(t,-29);if(S.settings.capitalDate>from)from=S.settings.capitalDate;const days=diffDays(from,t)+1;return days>0?spentR(from,t)/days:0}
function foodPerDay(){const t=today(),from=addDays(t,-6);return S.eats.filter(e=>!e.waste&&e.date>=from&&e.date<=t).reduce((s,e)=>s+eatVal(e),0)/7}
const catOf=id=>S.cats.find(c=>c.id===id);
const srcOf=id=>S.srcs.find(c=>c.id===id);
const colorOf=c=>`var(${CATCOL[(c?c.col:5)%6]})`;

function entries(filter){const out=[];
  for(const b of S.buys)out.push({k:'buy',id:b.id,date:b.date,ts:b.ts||0,title:b.name,sub:qty(b.qty,b.unit)+' · '+perUnit(b),amt:-b.price});
  for(const e of S.eats){const b=batch(e.batchId);out.push({k:e.waste?'waste':'eat',id:e.id,date:e.date,ts:e.ts||0,title:b?b.name:'Продукт удалён',sub:qty(e.qty,b?b.unit:'г')+' · на '+money(eatVal(e)),amt:null})}
  for(const s of S.spends){const c=catOf(s.catId);out.push({k:'spend',id:s.id,date:s.date,ts:s.ts||0,title:s.note||(c?c.name:'Расход'),sub:c?c.name:'Без категории',amt:-s.amount})}
  for(const i of S.incomes){const c=srcOf(i.srcId);out.push({k:'income',id:i.id,date:i.date,ts:i.ts||0,title:i.note||(c?c.name:'Доход'),sub:c?c.name:'Доход',amt:i.amount})}
  return out.filter(filter).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.ts-a.ts)}
const TAG={buy:'Купил',eat:'Съел',waste:'Выбросил',spend:'Расход',income:'Доход'};
function rowHTML(e){const a=e.amt==null?'<span></span>':`<span class="amt">${e.amt>0?'+':'−'}${money(Math.abs(e.amt))}</span>`;
  return `<div class="row"><span class="tag ${e.k}">${TAG[e.k]}</span><span class="t">${esc(e.title)}</span>${a}<span class="sub">${esc(e.sub)}</span><button class="x" data-del="${e.k}:${e.id}" aria-label="Удалить">Удалить</button></div>`}
function dayGroups(list){if(!list.length)return '<div class="empty">Записей нет. Нажмите «+», чтобы добавить.</div>';
  const g={};for(const e of list)(g[e.date]=g[e.date]||[]).push(e);
  return Object.keys(g).map(d=>{const sp=spentOn(d),ea=eatenOn(d);return `<div class="day"><b>${dayLabel(d)}</b><span class="micro">${sp?'−'+money(sp):''}${sp&&ea?' · ':''}${ea?'съел '+money(ea):''}</span></div><div>${g[d].map(rowHTML).join('')}</div>`}).join('')}
const sh=(t,micro='')=>`<header class="sh"><h2>${t}</h2><span class="micro">${micro}</span></header>`;
const giant=(v,cls='')=>{const s=nf.format(Math.round(Math.abs(v)));return `<div class="giant ${v<0?'neg':''} ${cls}" style="--len:${s.length+(v<0?1:0)+.6}"><span data-count="${Math.round(v)}">${v<0?'−':''}${s}</span><span class="cur">₸</span></div>`};
const cell=(l,v,s,cls='')=>`<div class="cell"><span class="micro">${l}</span><span class="v ${cls}">${v}</span><span class="s">${s}</span></div>`;

// ---- экраны ----
function vToday(){const t=today(),m=monthOf(t),avg=avgDaily(),em=eatenMap(),tot=totalMoney();
  const carry=mCarry(m),spent=mSpent(m),end=mEnd(m),mm=+m.slice(5)-1;
  const daysLeft=avg>0&&tot>0?Math.floor(tot/avg):null;
  const low=S.buys.filter(b=>{const r=rem(b,em);return r>0&&r/b.qty<=0.25});
  let h='';
  if(S.demo)h+=`<section class="note"><span class="micro">Пример</span><p>Здесь пока пример, чтобы было видно, как всё считается. Когда разберётесь, очистите его, укажите, сколько денег у вас сейчас, и добавьте зарплату или другой доход.</p><button data-act="clear-demo">Очистить и начать →</button></section>`;
  else if(!S.settings.capital&&!S.buys.length&&!S.spends.length&&!S.incomes.length)h+=`<section class="note"><span class="micro">Начало</span><p>Укажите, сколько денег у вас сейчас, и добавьте доходы месяца: зарплату, деньги с депозита.</p><button data-act="go-set">Указать сумму →</button></section>`;
  const bySrc={};for(const i of S.incomes.filter(inR(m+'-01',mLast(m))))bySrc[i.srcId]=(bySrc[i.srcId]||0)+i.amount;
  const srcRows=Object.entries(bySrc).map(([id,v])=>{const c=srcOf(id);return `<dt>${esc(c?c.name:'Доход')}</dt><dd>+${money(v)}</dd>`}).join('');
  const carryLbl=m===startM()?'Было на начало учёта':'Перешло с '+MGEN[(mm+11)%12];
  h+=`<section class="hero"><div class="hero-h"><span class="micro">Осталось на ${MPRE[mm]}</span><span class="micro">${pad(mm+1)} / ${m.slice(0,4)}</span></div>${giant(end)}
    <dl class="ledger">${carry||m===startM()?`<dt>${carryLbl}</dt><dd>${smoney(carry)}</dd>`:''}${srcRows||`<dt>Доходы за ${MPRE[mm]}</dt><dd>0 ₸</dd>`}
    <dt>Потрачено в ${inMonthPrep(mm)}</dt><dd>−${money(spent)}</dd>
    ${!S.settings.carry&&Math.round(tot)!==Math.round(end)?`<dt class="tot">Всего, с прошлыми месяцами</dt><dd class="tot">${smoney(tot)}</dd>`:''}</dl></section>`;
  h+=`<div class="quick">${[['buy','Купил'],['eat','Съел'],['spend','Расход'],['income','Доход']].map(([k,l])=>`<button class="qbtn" data-open="${k}"><span class="plus">+</span>${l}</button>`).join('')}</div>`;
  if(mStart(m)>0){const a=allowance();const ws=weekStart(t),wa=ws<m+'-01'?m+'-01':ws,we0=addDays(ws,6),wb=we0>mLast(m)?mLast(m):we0;
    const wSp=spentR(wa,wb),wPl=planR(wa,wb),over=a.rest<0;
    h+=`<section class="field ${over?'alert':''}">
      <div class="frow"><span class="micro">${over?'Перерасход сегодня':'Можно ещё потратить сегодня'}</span><span class="micro">Лимит ${money(Math.max(0,a.per))}</span></div>
      <div class="big2">${money(Math.abs(a.rest))}</div>
      <div class="meter"><i style="width:${pct(a.spent,a.per)}%"></i></div>
      <div class="frow"><span>Неделя ${rangeLabel(wa,wb)}</span><span class="v">${money(wSp)} / ${money(wPl)}</span></div>
      <div class="meter"><i style="width:${pct(wSp,wPl)}%"></i></div>
      <p>${money(Math.max(0,a.avail))} на ${a.left} ${a.left===1?'день':a.left<5?'дня':'дней'} до конца месяца. Сэкономил вчера — сегодня можно больше.</p></section>`}
  else h+=`<section class="field"><span class="micro">Бюджет на день и неделю</span><p style="font-size:16px;opacity:1">Добавьте доход за ${MPRE[mm]} (зарплату, деньги с депозита), и здесь появится лимит на день и на неделю.</p><button class="fbtn" data-open="income">Добавить доход →</button></section>`;
  h+=`<section>${sh('Сегодня',dLong(t))}<div class="grid4">
    ${cell('Потратил',money(spentOn(t)),'в среднем '+money(avg)+' в день')}
    ${cell('Съел на',money(eatenOn(t)),'обычно '+money(foodPerDay())+' в день')}
    ${cell('Еды дома на',money(stockValue()),S.buys.filter(b=>rem(b,em)>0).length+' продуктов')}
    ${cell('Денег хватит',daysLeft==null?'—':'≈ '+daysLeft+' дн.','при таких тратах')}</div></section>`;
  if(low.length)h+=`<section>${sh('Заканчивается',low.length+' поз.')}<div>${low.map(b=>`<div class="row"><span class="tag low">Мало</span><span class="t">${esc(b.name)}</span><span class="amt">${qty(rem(b,em),b.unit)}</span></div>`).join('')}</div></section>`;
  const te=entries(e=>e.date===t);
  h+=`<section>${sh('Записи',te.length?te.length+' за сегодня':'')}${te.length?`<div>${te.map(rowHTML).join('')}</div>`:'<div class="empty">Сегодня пока ничего. Купили или поели? Нажмите кнопку выше.</div>'}</section>`;
  return h}

function vStock(){const m=eatenMap();const act=S.buys.filter(b=>rem(b,m)>0).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);const fin=S.buys.filter(b=>rem(b,m)<=0).sort((a,b)=>a.date<b.date?1:-1);
  let h=`<section class="hero"><div class="hero-h"><span class="micro">Еды дома на</span><span class="micro">${act.length} продуктов</span></div>${giant(stockValue())}</section>`;
  h+=`<section>${sh('В запасе','сначала старые')}`;
  h+=act.length?`<div>${act.map(b=>{const r=rem(b,m),p=r/b.qty*100;return `<article class="item"><div class="item-h"><b>${esc(b.name)}</b><span>${qty(r,b.unit)} <span class="micro">из ${qty(b.qty,b.unit)}</span></span></div>
    <div class="line ${p<=25?'low':''}"><i style="width:${p.toFixed(1)}%"></i></div>
    <div class="item-f"><span>Куплено ${dLong(b.date)} · ${perUnit(b)}</span><span>≈ ${money(r*unitPrice(b))}</span></div>
    <div class="item-a"><button class="sbtn main" data-open="eat" data-batch="${b.id}">Съел</button><button class="sbtn" data-open="waste" data-batch="${b.id}">Выбросил</button></div></article>`}).join('')}</div>`:'<div class="empty">Дома пусто. Запишите покупку, и продукты появятся здесь.</div>';
  h+=`</section>`;
  if(fin.length){h+=`<section><button class="link" data-act="toggle-fin">${showFinished?'Скрыть закончившиеся':'Закончившиеся ('+fin.length+') →'}</button>`;
    if(showFinished)h+=`<div>${fin.map(b=>`<div class="row"><span class="tag">${dLong(b.date)}</span><span class="t">${esc(b.name)}</span><span class="amt">${money(b.price)}</span><span class="sub">${qty(b.qty,b.unit)} · ${perUnit(b)}</span></div>`).join('')}</div>`;
    h+=`</section>`}
  return h}

function periodHead(isM){const cur=today();if(isM){const[y,mm]=month.split('-').map(Number);
    return `<div class="period"><div><span class="micro">${y}</span><h1>${MON[mm-1]}</h1></div><div class="arrows"><button data-act="mprev" aria-label="Предыдущий месяц">←</button><button data-act="mnext" aria-label="Следующий месяц" ${month>=cur.slice(0,7)?'disabled':''}>→</button></div></div>`}
  return `<div class="period w"><div><span class="micro">Неделя${week===weekStart(cur)?', текущая':''}</span><h1>${rangeLabel(week,addDays(week,6))}</h1></div><div class="arrows"><button data-act="wprev" aria-label="Предыдущая неделя">←</button><button data-act="wnext" aria-label="Следующая неделя" ${week>=weekStart(cur)?'disabled':''}>→</button></div></div>`}
function vLog(){return periodHead(true)+`<section>${dayGroups(entries(e=>e.date.slice(0,7)===month))}</section>`}

function vStats(){const cur=today(),isM=statMode==='month';
  const from=isM?month+'-01':week,to=isM?mLast(month):addDays(week,6);
  const f=inR(from,to),buys=S.buys.filter(f),spends=S.spends.filter(f),incs=S.incomes.filter(f),eats=S.eats.filter(e=>e.date>=from&&e.date<=to);
  const total=sum(buys,'price')+sum(spends,'amount'),inc=sum(incs,'amount');
  const eaten=eats.filter(e=>!e.waste).reduce((s,e)=>s+eatVal(e),0),waste=eats.filter(e=>e.waste).reduce((s,e)=>s+eatVal(e),0);
  const last=to<cur?to:cur,elapsed=from>cur?0:diffDays(from,last)+1,avg=elapsed?total/elapsed:0,plan=planR(from,to);
  let h=`<div class="seg s2"><button data-smode="month" aria-pressed="${isM}">По месяцам</button><button data-smode="week" aria-pressed="${!isM}">По неделям</button></div>`+periodHead(isM);
  if(isM){const st=mStart(month),en=mEnd(month),cr=mCarry(month),isCur=month===cur.slice(0,7),dm=dim(month);
    h+=`<section><div class="grid4">
      ${cell('Было на месяц',smoney(st),(cr?'перешло '+smoney(cr)+' + ':'')+'доходы '+money(inc))}
      ${cell('Потратил',money(total),money(avg)+' в день')}
      ${cell('Осталось',smoney(en),isCur?'к концу ≈ '+smoney(st-avg*dm):S.settings.carry?'перешло дальше':'отложено',en<0?'neg':'')}
      ${cell('Съел на',money(eaten),'выброшено на '+money(waste))}</div></section>`}
  else{const left=plan-total;
    h+=`<section><div class="grid4">
      ${cell('Лимит недели',money(plan),'≈ '+money(plan/7)+' в день')}
      ${cell('Потратил',money(total),left>=0?'в запасе '+money(left):'сверх лимита '+money(-left),left<0?'neg':'')}
      ${cell('Съел на',money(eaten),'выброшено на '+money(waste))}
      ${cell('Доходы','+'+money(inc),'за эту неделю')}</div></section>`}
  const ds_=daysOf(from,to),vals=ds_.map(spentOn),buds=ds_.map(dayBudget),lim=Math.max(...buds,0),mx=Math.max(...vals,lim,1);
  h+=`<section>${sh('По дням')}<div class="chart-top"><span class="micro">Макс. ${money(Math.max(...vals,0))}</span>${lim?`<span class="micro lim">- - Лимит ${money(lim)}</span>`:''}</div>
    <div class="bars">${ds_.map((d,i)=>`<div class="${vals[i]?'':'zero'} ${lim&&vals[i]>buds[i]?'over':''} ${d===cur?'now':''}" style="height:${(vals[i]/mx*100).toFixed(1)}%" title="${dLong(d)}: ${money(vals[i])}"></div>`).join('')}${lim?`<span class="plan" style="bottom:${(lim/mx*100).toFixed(1)}%"></span>`:''}</div>
    ${isM?`<div class="axis micro"><span>1</span><span>10</span><span>20</span><span>${dim(month)}</span></div>`:`<div class="axis w micro">${ds_.map(d=>`<span>${WD[new Date(d+'T12:00:00').getDay()]}</span>`).join('')}</div>`}</section>`;
  if(isM){let rows='';for(let ws=weekStart(from);ws<=to;ws=addDays(ws,7)){const a=ws<from?from:ws,b0=addDays(ws,6),b=b0>to?to:b0;const sp=spentR(a,b),pl=planR(a,b);const isNow=cur>=a&&cur<=b,fut=a>cur,ov=sp>pl&&pl>0;
      rows+=`<div class="cat ${isNow?'cur':''}"><span>${rangeLabel(a,b)}${isNow?'<span class="pct">сейчас</span>':''}</span><span class="amt ${ov?'neg':''}">${fut?'—':money(sp)} <span class="pct">из ${money(pl)}</span></span><div class="line ${ov?'over':''}"><i style="width:${pct(sp,Math.max(pl,sp))}%"></i></div></div>`}
    h+=`<section>${sh('По неделям','потрачено из лимита')}<div>${rows}</div></section>`;
    const bySrc={};for(const i of incs)bySrc[i.srcId]=(bySrc[i.srcId]||0)+i.amount;const cr=mCarry(month);
    const src=[...(cr?[{n:month===startM()?'Было на начало учёта':'Перешло с прошлого месяца',v:cr,c:'var(--c3)'}]:[]),...Object.entries(bySrc).map(([id,v])=>{const c=srcOf(id);return{n:c?c.name:'Доход',v,c:colorOf(c)}})].sort((a,b)=>b.v-a.v);
    if(src.length){const mxs=Math.max(...src.map(x=>x.v),1);h+=`<section>${sh('Откуда деньги')}<div>${src.map(x=>`<div class="cat"><span>${esc(x.n)}</span><span class="amt">${smoney(x.v)}</span><div class="line"><i style="width:${pct(x.v,mxs)}%;background:${x.c}"></i></div></div>`).join('')}</div></section>`}}
  const cats=S.cats.map(c=>({c,v:sum(spends.filter(s=>s.catId===c.id),'amount')+(c.id==='food'?sum(buys,'price'):0)}));
  const orphan=sum(spends.filter(s=>!catOf(s.catId)),'amount');if(orphan)cats.push({c:{name:'Без категории',col:5},v:orphan});
  const cs=cats.filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  h+=`<section>${sh('Куда ушли деньги',money(total))}${cs.length?`<div>${cs.map(x=>`<div class="cat"><span>${esc(x.c.name)}<span class="pct">${Math.round(x.v/total*100)}%</span></span><span class="amt">${money(x.v)}</span><div class="line"><i style="width:${pct(x.v,cs[0].v)}%;background:${colorOf(x.c)}"></i></div></div>`).join('')}</div>`:`<div class="empty">За ${isM?'этот месяц':'эту неделю'} трат нет.</div>`}</section>`;
  const top={};for(const e of eats){if(e.waste)continue;const b=batch(e.batchId);if(!b)continue;const k=b.name.trim().toLowerCase();top[k]=top[k]||{n:b.name,v:0,q:0,u:b.unit};top[k].v+=eatVal(e);top[k].q+=e.qty}
  const tl=Object.values(top).sort((a,b)=>b.v-a.v).slice(0,7);
  if(tl.length)h+=`<section>${sh('На что уходит еда',money(eaten))}<div>${tl.map(x=>`<div class="cat"><span>${esc(x.n)}<span class="pct">${qty(x.q,x.u)}</span></span><span class="amt">${money(x.v)}</span><div class="line"><i style="width:${pct(x.v,tl[0].v)}%"></i></div></div>`).join('')}</div></section>`;
  return h}

function chipsManage(list,attr){return `<div class="chips">${list.map(c=>`<span class="chip"><i style="background:${colorOf(c)}"></i>${esc(c.name)}${c.fixed?'<span style="width:8px"></span>':`<button class="x" data-${attr}="${c.id}" aria-label="Удалить: ${esc(c.name)}">×</button>`}</span>`).join('')}</div>`}
function vSet(){let h='';
  if(isAppBuild&&!isStandalone())h+=`<section>${sh('Приложение')}<div class="block">${installEvt?`<p>Установите трекер на телефон: он будет открываться отдельной иконкой и работать без интернета.</p><button class="primary" data-act="install"><span>Установить</span><span>→</span></button>`:`<p>Чтобы поставить трекер иконкой на телефон, откройте меню Chrome ⋮ и выберите «Установить приложение» или «Добавить на главный экран».</p>`}</div></section>`;
  h+=`<section>${sh('Начало учёта')}<form class="block" id="capForm"><p>Сколько денег у вас на руках в день, с которого начинаете вести учёт. Дальше каждый месяц пополняется доходами: зарплата, депозит и другие. Их добавляйте кнопкой «Доход».</p>
    <div class="two eq"><label class="fld"><span class="micro">Сумма, ₸</span><input id="s_cap" inputmode="decimal" value="${S.settings.capital||''}" placeholder="35000"></label>
    <label class="fld"><span class="micro">На дату</span><input id="s_capdate" type="date" value="${S.settings.capitalDate}"></label></div><button class="primary" type="submit"><span>Сохранить</span><span>→</span></button></form></section>`;
  h+=`<section>${sh('Месяцы')}<div class="block"><label class="check"><input type="checkbox" id="s_carry" ${S.settings.carry?'checked':''}>Переносить остаток на следующий месяц</label>
    <p>${S.settings.carry?'Что не потратили в этом месяце, добавится к деньгам следующего.':'Каждый месяц начинается только с доходов этого месяца. Остаток считается отложенным, а общая сумма видна на главной.'}</p></div></section>`;
  h+=`<section>${sh('Источники дохода')}<div class="block">${chipsManage(S.srcs,'delsrc')}
    <form class="inline" id="srcForm"><input id="s_newsrc" placeholder="Например, «Стипендия»" maxlength="30"><button class="primary" type="submit">Добавить</button></form></div></section>`;
  h+=`<section>${sh('Категории расходов')}<div class="block">${chipsManage(S.cats,'delcat')}
    <form class="inline" id="catForm"><input id="s_newcat" placeholder="Например, «Кафе»" maxlength="30"><button class="primary" type="submit">Добавить</button></form>
    <p>«Продукты» удалить нельзя: туда попадают покупки еды. Если удалить другую категорию, её старые записи останутся в статистике как «Без категории».</p></div></section>`;
  h+=`<section>${sh('Резервная копия')}<div class="block"><p>${storageOk?'Всё хранится только на этом телефоне. Если очистить данные браузера, записи пропадут, поэтому иногда сохраняйте копию, например в заметках.':'<b style="color:var(--red-text)">Браузер не даёт сохранять данные.</b> Записи пропадут после закрытия страницы. Сохраните копию, прежде чем уйти.'}</p>
    <button class="ghost" data-act="copy">Скопировать копию</button>
    <textarea id="s_out" readonly hidden aria-label="Резервная копия"></textarea>
    <label class="fld"><span class="micro">Восстановить: вставьте скопированный текст</span><textarea id="s_paste" placeholder='{"v":2,...}' style="margin-top:6px"></textarea></label>
    <label class="fld"><span class="micro">или выберите файл с копией</span><input id="s_file" type="file" accept=".json,.txt,application/json,text/plain"></label>
    <button class="ghost" data-act="restore">Восстановить из копии</button>
    <p class="err" id="s_err" hidden></p></div></section>`;
  h+=`<section>${sh('Сброс')}<div class="block"><p>Удалит все покупки, еду, расходы и доходы. Категории и источники останутся.</p><button class="danger" data-confirm="wipe">Удалить все записи</button></div></section>`;
  return h}

const VIEWS={today:vToday,stock:vStock,log:vLog,stats:vStats,set:vSet};
const TABS=[['today','Сегодня','<path d="M4 20V9l8-5 8 5v11z"/><path d="M10 20v-6h4v6"/>'],['stock','Запасы','<rect x="5" y="3" width="14" height="18"/><path d="M5 10h14M8 6v1.5M8 13v2.5"/>'],['log','Журнал','<path d="M8 6h12M8 12h12M8 18h12M4 6h.5M4 12h.5M4 18h.5"/>'],['stats','Цифры','<path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/>'],['set','Ещё','<path d="M4 7h16M4 12h16M4 17h16"/>']];
function render(){const t=today(),d=new Date(t+'T12:00:00');$('hdrDate').textContent=pad(d.getDate())+'.'+pad(d.getMonth()+1)+' · '+WD[d.getDay()];
  $('tabs').innerHTML=TABS.map(([k,l,i])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24">${i}</svg>${l}</button>`).join('');
  const v=$('view');v.innerHTML=VIEWS[tab]();
  if(animateNext){v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');animateNext=false}else v.classList.remove('enter');
  if(firstLoad){firstLoad=false;countUp()}}
function countUp(){const el=document.querySelector('#view [data-count]');if(!el)return;try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  const target=+el.dataset.count,neg=target<0,abs=Math.abs(target),t0=performance.now(),dur=900;
  const step=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);el.textContent=(neg?'−':'')+nf.format(Math.round(abs*e));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

// ---- лист с формами ----
const $=id=>document.getElementById(id);
const sheet=$('sheet'),backdrop=$('backdrop'),sheetIn=$('sheetIn');
let preBatch=null,preWaste=false;
function openSheet(mode,opts={}){sheetMode=mode==='waste'?'eat':mode;preBatch=opts.batch||null;preWaste=mode==='waste';trip={n:0,sum:0};renderSheet();sheet.hidden=false;backdrop.hidden=false;document.body.style.overflow='hidden'}
function closeSheet(){sheet.hidden=true;backdrop.hidden=true;document.body.style.overflow=''}
function nameList(){const seen=new Map();for(const b of [...S.buys].sort((a,b)=>(a.date+a.ts)<(b.date+b.ts)?-1:1))seen.set(b.name.trim().toLowerCase(),b);return seen}
function pickHTML(list,name,def){return `<div class="pick">${list.map((c,i)=>`<label><input type="radio" name="${name}" value="${c.id}" id="f_${name}_${i}" ${c.id===def?'checked':''}><span><i style="background:${colorOf(c)}"></i>${esc(c.name)}</span></label>`).join('')}</div>`}
const SAVE=`<button type="submit" class="primary"><span>Сохранить</span><span>→</span></button>`;
function renderSheet(){const t=today();const head=`<div class="sheet-h"><span class="micro">Новая запись</span><button type="button" class="x" data-act="close">Закрыть ×</button></div><div class="seg">${[['buy','Купил'],['eat','Съел'],['spend','Расход'],['income','Доход']].map(([k,l])=>`<button type="button" data-seg="${k}" aria-pressed="${sheetMode===k}">${l}</button>`).join('')}</div>`;
  let f='';
  if(sheetMode==='buy'){const names=[...nameList().values()];
    f=`<form id="frm"><label class="fld"><span class="micro">Что купил</span><input id="f_name" list="dl_names" autocomplete="off" placeholder="Курица" maxlength="60"></label>
    <datalist id="dl_names">${names.map(b=>`<option value="${esc(b.name)}">`).join('')}</datalist>
    <div class="two"><label class="fld"><span class="micro">Сколько</span><input id="f_qty" inputmode="decimal" placeholder="1"></label>
    <label class="fld"><span class="micro">Ед.</span><select id="f_unit"><option>кг</option><option>г</option><option>шт</option><option>л</option><option>мл</option></select></label></div>
    <label class="fld"><span class="micro">Цена за всё, ₸</span><input id="f_price" inputmode="decimal" placeholder="3000"></label>
    <label class="fld"><span class="micro">Дата</span><input id="f_date" type="date" value="${t}" max="${t}"></label>
    <p class="hint" id="f_hint"></p><p class="err" id="f_err" hidden></p>
    <div class="btns"><button type="button" class="ghost" data-act="save-more">Сохранить и ещё</button>${SAVE}</div>
    ${trip.n?`<p class="trip">В этом походе: ${trip.n} ${trip.n===1?'товар':trip.n<5?'товара':'товаров'} на <b>${money(trip.sum)}</b></p>`:''}</form>`}
  else if(sheetMode==='eat'){const m=eatenMap();const av=S.buys.filter(b=>rem(b,m)>0).sort((a,b)=>a.name.localeCompare(b.name,'ru')||(a.date<b.date?-1:1));
    if(!av.length)f=`<div class="empty">Дома пусто. Сначала запишите покупку.</div><button class="primary" data-seg="buy"><span>Записать покупку</span><span>→</span></button>`;
    else{const sel=preBatch&&av.find(b=>b.id===preBatch)?preBatch:av[0].id;
      f=`<form id="frm"><label class="fld"><span class="micro">Что</span><select id="f_batch">${av.map(b=>`<option value="${b.id}" ${b.id===sel?'selected':''}>${esc(b.name)} · осталось ${qty(rem(b,m),b.unit)}${av.filter(x=>x.name===b.name).length>1?' ('+dLong(b.date)+')':''}</option>`).join('')}</select></label>
      <div class="two"><label class="fld"><span class="micro">Сколько</span><input id="f_eqty" inputmode="decimal" placeholder="300"></label><label class="fld"><span class="micro">Ед.</span><input id="f_eunit" readonly tabindex="-1"></label></div>
      <div class="item-a"><button type="button" class="sbtn" data-fill="all">Всё, что осталось</button><button type="button" class="sbtn" data-fill="half">Половину</button></div>
      <label class="check"><input type="checkbox" id="f_waste" ${preWaste?'checked':''}>Выбросил: испортилось или не доел</label>
      <label class="fld"><span class="micro">Дата</span><input id="f_edate" type="date" value="${t}" max="${t}"></label>
      <p class="hint" id="f_hint"></p><p class="err" id="f_err" hidden></p>${SAVE}</form>`}}
  else if(sheetMode==='spend'){const def=(S.cats.find(x=>x.name==='Другое')||S.cats[S.cats.length-1]).id;
    f=`<form id="frm"><label class="fld"><span class="micro">Сумма, ₸</span><input id="f_amount" inputmode="decimal" placeholder="1200"></label>
    <fieldset><span class="micro">Категория</span>${pickHTML(S.cats,'cat',def)}</fieldset>
    <label class="fld"><span class="micro">На что (необязательно)</span><input id="f_note" placeholder="Такси до работы" maxlength="60"></label>
    <label class="fld"><span class="micro">Дата</span><input id="f_sdate" type="date" value="${t}" max="${t}"></label>
    <p class="err" id="f_err" hidden></p>${SAVE}<p class="hint">Новые категории добавляются во вкладке «Ещё».</p></form>`}
  else{const def=(S.srcs[0]||{}).id;
    f=`<form id="frm"><label class="fld"><span class="micro">Сумма, ₸</span><input id="f_iamount" inputmode="decimal" placeholder="250000"></label>
    <fieldset><span class="micro">Откуда</span>${pickHTML(S.srcs,'src',def)}</fieldset>
    <label class="fld"><span class="micro">Комментарий (необязательно)</span><input id="f_inote" placeholder="Аванс за октябрь" maxlength="60"></label>
    <label class="fld"><span class="micro">Дата</span><input id="f_idate" type="date" value="${t}"></label>
    <p class="hint">Доход попадёт в бюджет того месяца, на дату которого записан.</p>
    <p class="err" id="f_err" hidden></p>${SAVE}</form>`}
  sheetIn.innerHTML=head+f;if(sheetMode==='eat')syncEat();}

function errMsg(m){const e=$('f_err');if(e){e.textContent=m;e.hidden=!m}}
function syncEat(){const sel=$('f_batch');if(!sel)return;const b=batch(sel.value),r=rem(b,eatenMap());
  $('f_eunit').value=b.unit;const q=num($('f_eqty').value);
  $('f_hint').textContent=q>0?`≈ ${money(q*unitPrice(b))} · останется ${qty(Math.max(0,r-q),b.unit)}`:`Осталось ${qty(r,b.unit)}, ${perUnit(b)}`}
function syncBuy(){const h=$('f_hint');if(!h)return;const q=num($('f_qty').value),p=num($('f_price').value),u=$('f_unit').value;
  if(q>0&&p>0){const per=u==='кг'||u==='л'||u==='шт'?p/q:p/q*1000;h.textContent='≈ '+money(per)+(u==='шт'?'/шт':u==='г'||u==='кг'?'/кг':'/л')}else h.textContent=''}
function prefillBuy(){const b=nameList().get($('f_name').value.trim().toLowerCase());if(!b)return;const fq=$('f_qty'),fu=$('f_unit'),fp=$('f_price');
  if(!fq.value){if(b.unit==='г'&&b.qty>=1000){fu.value='кг';fq.value=b.qty/1000}else if(b.unit==='мл'&&b.qty>=1000){fu.value='л';fq.value=b.qty/1000}else{fu.value=b.unit;fq.value=b.qty}}
  if(!fp.value)fp.value=b.price;syncBuy();$('f_hint').textContent+=' · как в прошлый раз ('+dLong(b.date)+')'}

function submitForm(more){const now=Date.now();
  if(sheetMode==='buy'){const name=$('f_name').value.trim(),q0=num($('f_qty').value),p=num($('f_price').value),u0=$('f_unit').value,d=$('f_date').value||today();
    if(!name)return errMsg('Напишите, что купили.');if(!(q0>0))return errMsg('Укажите количество больше нуля.');if(!(p>=0))return errMsg('Укажите цену в тенге.');
    const u=u0==='кг'?'г':u0==='л'?'мл':u0,q=u0==='кг'||u0==='л'?q0*1000:q0;
    S.buys.push({id:uid(),name,qty:q,unit:u,price:p,date:d,ts:now});save();trip.n++;trip.sum+=p;
    if(more){renderSheet();$('f_date').value=d;toast('Записано: '+name);render();$('f_name').focus();return}
    toast(trip.n>1?`Поход записан: ${trip.n} товаров на ${money(trip.sum)}`:'Записано: '+name)}
  else if(sheetMode==='eat'){const b=batch($('f_batch').value),q=num($('f_eqty').value),w=$('f_waste').checked,d=$('f_edate').value||today(),r=rem(b,eatenMap());
    if(!(q>0))return errMsg('Укажите, сколько съели.');if(q>r+1e-9)return errMsg(`Больше, чем осталось: дома только ${qty(r,b.unit)}.`);
    if(d<b.date)return errMsg('Дата раньше, чем день покупки.');
    S.eats.push({id:uid(),batchId:b.id,qty:q,waste:w,date:d,ts:now});save();toast((w?'Выброшено: ':'Съедено: ')+b.name+', '+qty(q,b.unit))}
  else if(sheetMode==='spend'){const a=num($('f_amount').value),c=(document.querySelector('input[name="cat"]:checked')||{}).value,d=$('f_sdate').value||today();
    if(!(a>0))return errMsg('Укажите сумму больше нуля.');S.spends.push({id:uid(),catId:c,amount:a,note:$('f_note').value.trim(),date:d,ts:now});save();toast('Расход записан: '+money(a))}
  else{const a=num($('f_iamount').value),c=(document.querySelector('input[name="src"]:checked')||{}).value,d=$('f_idate').value||today();if(!(a>0))return errMsg('Укажите сумму больше нуля.');
    S.incomes.push({id:uid(),srcId:c,amount:a,note:$('f_inote').value.trim(),date:d,ts:now});save();toast('Доход записан: +'+money(a))}
  closeSheet();render()}

// ---- события ----
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
function arm(btn,fn,label){if(btn.dataset.armed){fn();return}const old=btn.textContent;btn.dataset.armed='1';btn.textContent=label||'Точно?';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old}},3000)}
function addChip(listKey,inputId){const n=$(inputId).value.trim();if(!n)return;const list=S[listKey];if(list.some(c=>c.name.toLowerCase()===n.toLowerCase())){toast('Такой уже есть');return}
  const used=list.map(c=>c.col);let col=[1,2,3,4,5,0].find(x=>!used.includes(x));if(col==null)col=list.length%6;list.push({id:uid(),name:n,col});save();render();toast('Добавлено: '+n)}

document.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el)return;const d=el.dataset;
  if(d.tab){if(tab!==d.tab){tab=d.tab;animateNext=true}render();try{window.scrollTo(0,0)}catch(e){}return}
  if(d.open){openSheet(d.open,{batch:d.batch});return}
  if(d.seg){sheetMode=d.seg;preWaste=false;renderSheet();return}
  if(d.smode){statMode=d.smode;animateNext=true;render();return}
  if(d.fill){const b=batch($('f_batch').value),r=rem(b,eatenMap());$('f_eqty').value=+(d.fill==='all'?r:r/2).toFixed(2);syncEat();return}
  if(d.del){const[k,id]=d.del.split(':');arm(el,()=>{
      if(k==='buy'){S.buys=S.buys.filter(x=>x.id!==id);S.eats=S.eats.filter(x=>x.batchId!==id)}
      else if(k==='eat'||k==='waste')S.eats=S.eats.filter(x=>x.id!==id);
      else if(k==='spend')S.spends=S.spends.filter(x=>x.id!==id);else S.incomes=S.incomes.filter(x=>x.id!==id);
      save();render();toast('Удалено')},k==='buy'&&S.eats.some(x=>x.batchId===id)?'И съеденное?':'Точно?');return}
  if(d.delcat){arm(el,()=>{S.cats=S.cats.filter(c=>c.id!==d.delcat);save();render();toast('Категория удалена')},'?');return}
  if(d.delsrc){if(S.srcs.length<=1){toast('Нужен хотя бы один источник');return}arm(el,()=>{S.srcs=S.srcs.filter(c=>c.id!==d.delsrc);save();render();toast('Источник удалён')},'?');return}
  if(d.confirm==='wipe'){arm(el,()=>{S.buys=[];S.eats=[];S.spends=[];S.incomes=[];S.demo=false;save();render();toast('Все записи удалены')},'Нажмите ещё раз, чтобы удалить');return}
  switch(d.act){
    case 'close':closeSheet();break;
    case 'save-more':submitForm(true);break;
    case 'clear-demo':S=blank();save();tab='set';animateNext=true;render();toast('Пример очищен. Укажите, сколько денег у вас сейчас.');break;
    case 'go-set':tab='set';animateNext=true;render();break;
    case 'toggle-fin':showFinished=!showFinished;render();break;
    case 'mprev':month=shiftM(month,-1);animateNext=true;render();break;
    case 'mnext':month=shiftM(month,1);animateNext=true;render();break;
    case 'wprev':week=addDays(week,-7);animateNext=true;render();break;
    case 'wnext':week=addDays(week,7);animateNext=true;render();break;
    case 'install':if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}break;
    case 'copy':{const txt=JSON.stringify(S),out=$('s_out');out.value=txt;out.hidden=false;
      const sel=()=>{out.focus();out.select()};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Копия в буфере обмена. Сохраните её в заметках.'),()=>{sel();toast('Скопируйте выделенный текст вручную')})}catch(e){sel();toast('Скопируйте выделенный текст вручную')}break}
    case 'restore':{const txt=$('s_paste').value.trim(),er=$('s_err');
      try{const o=JSON.parse(txt);if(!o||!Array.isArray(o.buys)||!Array.isArray(o.cats))throw 0;S=migrate(o);S.demo=false;save();render();toast('Данные восстановлены')}
      catch(e){er.textContent='Не получилось прочитать копию. Вставьте текст целиком, от первой { до последней }.';er.hidden=false}break}
  }
});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;
  if(f.id==='frm')submitForm(false);
  else if(f.id==='capForm'){const c=num($('s_cap').value||'0');if(!(c>=0)){toast('Введите сумму числом');return}S.settings.capital=c;S.settings.capitalDate=$('s_capdate').value||today();S.demo=false;save();render();toast('Сохранено')}
  else if(f.id==='catForm')addChip('cats','s_newcat');
  else if(f.id==='srcForm')addChip('srcs','s_newsrc')});
document.addEventListener('input',ev=>{const id=ev.target.id;
  if(id==='f_eqty'){syncEat();errMsg('')}
  else if(id==='f_qty'||id==='f_price'){syncBuy();errMsg('')}
  else if(id==='f_name')errMsg('')});
document.addEventListener('change',ev=>{const id=ev.target.id;
  if(id==='f_batch'){$('f_eqty').value='';syncEat()}
  else if(id==='f_unit')syncBuy();
  else if(id==='f_name')prefillBuy();
  else if(id==='s_carry'){S.settings.carry=ev.target.checked;save();render();toast(S.settings.carry?'Остаток будет переноситься':'Каждый месяц отдельно')}
  else if(id==='s_file'){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{$('s_paste').value=r.result;toast('Файл загружен. Нажмите «Восстановить из копии».')};r.readAsText(file)}});
$('fab').addEventListener('click',()=>openSheet(tab==='stock'?'eat':'buy'));
backdrop.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='set')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('Приложение установлено');render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sheet.hidden)render()});
render();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
</body>
</html>
